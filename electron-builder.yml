appId: com.sourcemate.app
productName: SourceMate
# 显式声明发布目标:GitHub Releases(--publish always 时 electron-builder 才知道上传到哪,
# 否则静默跳过发布,构建成功但无资产)
# releaseType: release 关键——electron-builder 默认期望 draft 草稿,与 create-release 预创建的
# 正式 release 类型不兼容会直接跳过上传(existingType=release vs publishingType=draft)
publish:
  provider: github
  releaseType: release
directories:
  output: dist
files:
  - out/**
  - drizzle/**
  - package.json
# node:sqlite 为 Node 内置模块，无需原生依赖与 asarUnpack
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SourceMate
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Development
  artifactName: ${productName}-${version}.${ext}
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}.${ext}
