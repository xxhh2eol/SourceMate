name: Release

# 默认 GITHUB_TOKEN 为只读,创建 Release/上传产物需要写权限
permissions:
  contents: write

# 推送 v* 标签(如 v0.1.0)时,三平台并行构建安装包并上传到 GitHub Releases;
# 也可在 Actions 页手动触发(Run workflow)用于测试
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 预创建 Release(已存在则跳过):避免三平台并行 publish 时竞态创建同名 Release 导致资产分散
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # tag 触发用 tag 名(v0.1.0);手动触发用 package.json 版本
      - name: Resolve release name
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or skip release
        run: gh release create "${{ steps.ver.outputs.name }}" --repo "${{ github.repository }}" --generate-notes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite 为 Node 内置模块，需要 Node 22+；electron-vite 构建用 runner 的 node
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      - name: Package
        # electron-builder --publish always:自动创建/更新 GitHub Release 并上传产物
        run: npx electron-builder --publish always ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 无 Apple 开发者证书:跳过签名(产物可下载,打开需右键→打开)
          CSC_IDENTITY_AUTO_DISCOVERY: false
